name: Publish Grove homepage

on:
  push:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    # The default branch is determined by GitHub, rather than hard-coded here.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set source repository link
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = {"repositoryURL": os.environ["REPOSITORY_URL"]}
          Path("site/site-config.js").write_text("window.GROVE_SITE = " + json.dumps(config) + ";\n")
          PY
      - name: Check JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/site-config.js
      - name: Upload static homepage
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
